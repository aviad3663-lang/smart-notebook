<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartNotes | פלטפורמת סיכומי לימודים</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Assistant', 'Heebo', 'system-ui', 'sans-serif'],
            serif: ['Frank Ruhl Libre', 'David Libre', 'serif'],
          },
          colors: {
            stone: {
              750: '#221f1d',
              850: '#171513'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Assistant & Frank Ruhl Libre -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: 'Assistant', sans-serif;
      touch-action: manipulation;
    }

    /* Ambient Serene Study Background */
    .ambient-study-bg {
      background-color: #faf7f2;
      background-image: 
        radial-gradient(at 0% 0%, rgba(228, 218, 202, 0.45) 0px, transparent 55%),
        radial-gradient(at 100% 0%, rgba(210, 224, 218, 0.4) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(240, 228, 212, 0.45) 0px, transparent 60%);
      background-attachment: fixed;
    }

    .dark .ambient-study-bg {
      background-color: #131518;
      background-image: 
        radial-gradient(at 0% 0%, rgba(45, 36, 30, 0.5) 0px, transparent 55%),
        radial-gradient(at 100% 0%, rgba(28, 42, 38, 0.45) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(32, 28, 44, 0.5) 0px, transparent 60%);
      background-attachment: fixed;
    }

    /* Compact Notebook Tile */
    .compact-nb-card {
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .compact-nb-card:hover {
      transform: translateY(-4px);
    }

    /* Paper Grid Patterns for Stylus Canvas */
    .paper-ruled {
      background-color: #ffffff;
      background-image: repeating-linear-gradient(transparent, transparent 31px, #e8dfcd 31px, #e8dfcd 32px);
    }
    .dark .paper-ruled {
      background-color: #181b22;
      background-image: repeating-linear-gradient(transparent, transparent 31px, #272f3d 31px, #272f3d 32px);
    }

    .paper-grid {
      background-color: #ffffff;
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, #ede4d2 1px, transparent 1px),
        linear-gradient(to bottom, #ede4d2 1px, transparent 1px);
    }
    .dark .paper-grid {
      background-color: #181b22;
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, #262e3c 1px, transparent 1px),
        linear-gradient(to bottom, #262e3c 1px, transparent 1px);
    }

    .paper-dots {
      background-color: #ffffff;
      background-image: radial-gradient(#d3c6ae 1.5px, transparent 1.5px);
      background-size: 22px 22px;
    }
    .dark .paper-dots {
      background-color: #181b22;
      background-image: radial-gradient(#3a4659 1.5px, transparent 1.5px);
      background-size: 22px 22px;
    }

    .paper-blank {
      background-color: #ffffff;
    }
    .dark .paper-blank {
      background-color: #181b22;
    }

    /* Interactive Draggable & Resizable Sketch Widget */
    .sketch-widget {
      position: relative;
      display: inline-block;
      margin: 1.25rem 0;
      padding: 6px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px dashed rgba(160, 130, 90, 0.4);
      box-shadow: 0 4px 16px -2px rgba(60, 45, 25, 0.08);
      user-select: none;
      max-width: 100%;
    }
    .dark .sketch-widget {
      background: rgba(26, 30, 38, 0.95);
      border-color: rgba(120, 140, 180, 0.3);
      box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.35);
    }
    .sketch-widget:hover, .sketch-widget.active-widget {
      border-color: #c2884a;
      box-shadow: 0 6px 20px -2px rgba(194, 136, 74, 0.2);
    }

    .sketch-widget-toolbar {
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: all 0.2s ease;
    }
    .sketch-widget:hover .sketch-widget-toolbar,
    .sketch-widget.active-widget .sketch-widget-toolbar {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .sketch-resize-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #be8c54;
      border: 2px solid #ffffff;
      border-radius: 50%;
      cursor: nwse-resize;
      bottom: -6px;
      left: -6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 25;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .sketch-widget:hover .sketch-resize-handle,
    .sketch-widget.active-widget .sketch-resize-handle {
      opacity: 1;
    }

    .sketch-drag-handle {
      cursor: grab;
    }
    .sketch-drag-handle:active {
      cursor: grabbing;
    }

    #drawingCanvas {
      touch-action: none;
      cursor: crosshair;
    }

    #noteContent:focus {
      outline: none;
    }
    #noteContent h1 { font-size: 1.85rem; font-weight: 800; font-family: 'Frank Ruhl Libre', serif; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #2d261e; }
    #noteContent h2 { font-size: 1.4rem; font-weight: 700; font-family: 'Frank Ruhl Libre', serif; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #43392c; }
    #noteContent h3 { font-size: 1.15rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.35rem; color: #5a4d3c; }
    .dark #noteContent h1 { color: #f2eee6; }
    .dark #noteContent h2 { color: #e4ddcf; }
    .dark #noteContent h3 { color: #cfc5b4; }
    #noteContent p { margin-bottom: 0.85rem; line-height: 1.8; }
    #noteContent blockquote { border-right: 4px solid #be8c54; padding-right: 1.2rem; font-style: italic; margin: 1.2rem 0; color: #6f5f4b; background: rgba(190, 140, 84, 0.05); padding-top: 6px; padding-bottom: 6px; border-radius: 0 8px 8px 0; }
    .dark #noteContent blockquote { color: #b7a892; background: rgba(190, 140, 84, 0.1); }
    #noteContent code { background: #eee7d8; padding: 0.2rem 0.4rem; border-radius: 0.35rem; font-family: monospace; font-size: 0.9em; color: #8e5e34; }
    .dark #noteContent code { background: #222834; color: #d69f64; }
    #noteContent ul { list-style-type: disc; margin-right: 1.5rem; margin-bottom: 0.75rem; }
    #noteContent ol { list-style-type: decimal; margin-right: 1.5rem; margin-bottom: 0.75rem; }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #dcd2c1;
      border-radius: 6px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #343c4a;
    }

    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print, .sketch-widget-toolbar, .sketch-resize-handle { display: none !important; }
    }
  </style>
</head>
<body class="ambient-study-bg text-stone-800 dark:text-stone-100 h-full flex flex-col transition-colors duration-300">

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transform transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
    <div class="bg-stone-900/90 dark:bg-stone-800/95 backdrop-blur-md text-stone-100 px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2.5 border border-stone-700/60 text-xs sm:text-sm">
      <span id="toastIcon" class="text-amber-400"></span>
      <span id="toastMessage" class="font-medium">הודעה</span>
    </div>
  </div>

  <!-- Header Bar -->
  <header class="no-print bg-white/80 dark:bg-stone-900/80 backdrop-blur-md border-b border-stone-200/70 dark:border-stone-800 sticky top-0 z-30 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-2.5 cursor-pointer group" onclick="app.showDashboard()">
        <div class="w-8 h-8 rounded-lg bg-amber-800 flex items-center justify-center text-amber-50 shadow-sm">
          <i data-lucide="book-marked" class="w-4 h-4"></i>
        </div>
        <div>
          <span class="text-base font-bold font-serif tracking-tight text-stone-900 dark:text-stone-100">SmartNotes</span>
          <span class="text-[11px] text-stone-400 font-normal mr-1.5 hidden sm:inline">| סיכומים ומחברות</span>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="app.exportAllData()" title="ייצוא גיבוי (JSON)" class="p-2 text-stone-500 hover:text-stone-800 dark:text-stone-400 dark:hover:text-stone-100 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 transition">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
        <button onclick="document.getElementById('importFileInput').click()" title="ייבוא גיבוי" class="p-2 text-stone-500 hover:text-stone-800 dark:text-stone-400 dark:hover:text-stone-100 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 transition">
          <i data-lucide="upload" class="w-4 h-4"></i>
        </button>
        <input type="file" id="importFileInput" class="hidden" accept=".json" onchange="app.importAllData(event)">

        <button onclick="app.toggleDarkMode()" title="החלף מצב תאורה" class="p-2 text-stone-500 hover:text-stone-800 dark:text-stone-400 dark:hover:text-stone-100 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 transition">
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
        </button>

        <button onclick="app.openNewNotebookModal()" class="bg-amber-800 hover:bg-amber-900 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow-sm flex items-center gap-1.5 transition active:scale-95 mr-1">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>מחברת חדשה</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ============================================================== -->
  <!-- VIEW 1: DASHBOARD / COMPACT NOTEBOOK SHELF                     -->
  <!-- ============================================================== -->
  <main id="dashboardView" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 transition-opacity duration-300">
    
    <!-- Top Filter & Controls -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 bg-white/60 dark:bg-stone-900/60 p-3 rounded-2xl border border-stone-200/60 dark:border-stone-800 backdrop-blur-sm">
      
      <!-- Year Tabs -->
      <div class="flex items-center gap-1 overflow-x-auto pb-1 sm:pb-0 scrollbar-none" id="yearFilterTabs">
        <button onclick="app.setYearFilter('all')" class="year-tab px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-amber-800 text-white" data-year="all">הכל</button>
        <button onclick="app.setYearFilter('שנה א\'')" class="year-tab px-3 py-1.5 rounded-lg text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-stone-200/60 dark:hover:bg-stone-800" data-year="שנה א'">שנה א׳</button>
        <button onclick="app.setYearFilter('שנה ב\'')" class="year-tab px-3 py-1.5 rounded-lg text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-stone-200/60 dark:hover:bg-stone-800" data-year="שנה ב'">שנה ב׳</button>
        <button onclick="app.setYearFilter('שנה ג\'')" class="year-tab px-3 py-1.5 rounded-lg text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-stone-200/60 dark:hover:bg-stone-800" data-year="שנה ג'">שנה ג׳</button>
        <button onclick="app.setYearFilter('שנה ד\'')" class="year-tab px-3 py-1.5 rounded-lg text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-stone-200/60 dark:hover:bg-stone-800" data-year="שנה ד'">שנה ד׳</button>
      </div>

      <!-- Search & Subject Filter -->
      <div class="flex items-center gap-2">
        <div class="relative">
          <select id="subjectFilterSelect" onchange="app.setSubjectFilter(this.value)" class="bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 text-xs rounded-lg px-3 py-1.5 pr-6 appearance-none focus:outline-none">
            <option value="all">כל המקצועות</option>
            <option value="מתמטיקה">מתמטיקה</option>
            <option value="פיזיקה">פיזיקה</option>
            <option value="מדעי המחשב">מדעי המחשב</option>
            <option value="הנדסה">הנדסה</option>
            <option value="רפואה">רפואה</option>
            <option value="כללי">כללי</option>
          </select>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-stone-400 absolute left-2 top-2 pointer-events-none"></i>
        </div>

        <div class="relative w-44 sm:w-56">
          <i data-lucide="search" class="w-3.5 h-3.5 text-stone-400 absolute right-2.5 top-2.5 pointer-events-none"></i>
          <input type="text" id="searchInput" oninput="app.setSearchFilter(this.value)" placeholder="חיפוש מחברת..." class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-800 dark:text-stone-100 text-xs rounded-lg pl-3 pr-8 py-1.5 focus:outline-none">
        </div>
      </div>

    </div>

    <!-- Notebooks Grid: Clean, Compact Icons / Cards -->
    <div id="notebooksGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <!-- Empty State -->
    <div id="emptyState" class="text-center py-16 px-4 hidden">
      <div class="w-12 h-12 rounded-xl bg-amber-100/80 dark:bg-stone-800 flex items-center justify-center text-amber-800 dark:text-amber-300 mx-auto mb-3">
        <i data-lucide="book-open" class="w-6 h-6"></i>
      </div>
      <h3 class="text-base font-bold font-serif mb-1">לא נמצאו מחברות</h3>
      <p class="text-xs text-stone-400 max-w-xs mx-auto mb-3">נסה לאפס את החיפוש או צור מחברת חדשה</p>
      <button onclick="app.resetFilters()" class="text-amber-800 dark:text-amber-300 text-xs font-semibold hover:underline">
        איפוס סינונים
      </button>
    </div>

  </main>

  <!-- ============================================================== -->
  <!-- VIEW 2: NOTEBOOK WORKSPACE WITH SPACIOUS SURROUNDING MARGINS   -->
  <!-- ============================================================== -->
  <div id="editorView" class="flex-1 flex flex-col h-[calc(100vh-3.5rem)] p-3 sm:p-5 lg:p-6 max-w-[1600px] mx-auto w-full overflow-hidden hidden">
    
    <!-- Floating Header Bar Inside Workspace -->
    <div class="no-print bg-white/90 dark:bg-stone-850/90 backdrop-blur-md border border-stone-200/80 dark:border-stone-750 px-4 py-2.5 rounded-2xl flex items-center justify-between gap-3 shadow-xs mb-3">
      
      <!-- Back & Notebook Meta -->
      <div class="flex items-center gap-2.5">
        <button onclick="app.showDashboard()" title="חזרה למדף המחברות" class="p-1.5 text-stone-500 hover:text-stone-900 dark:text-stone-400 dark:hover:text-white hover:bg-stone-100 dark:hover:bg-stone-800 rounded-lg transition">
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
        <div>
          <div class="flex items-center gap-2">
            <h2 id="activeNotebookTitle" class="font-bold font-serif text-sm sm:text-base text-stone-900 dark:text-stone-50">שם מחברת</h2>
            <span id="activeNotebookSubjectBadge" class="text-[11px] px-2 py-0.2 rounded-md font-medium bg-amber-50 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-200/60">מקצוע</span>
          </div>
          <div class="flex items-center gap-1.5 text-[11px] text-stone-400">
            <span id="saveStatusIndicator" class="flex items-center gap-1 text-emerald-600 dark:text-emerald-400 font-medium">נשמר</span>
            <span>•</span>
            <span id="activeNotebookYear">שנה א'</span>
          </div>
        </div>
      </div>

      <!-- Mode Switcher Tabs (PC Text vs Tablet Canvas vs Dual Split) -->
      <div class="flex items-center bg-stone-100 dark:bg-stone-900 p-1 rounded-xl border border-stone-200 dark:border-stone-800">
        <button onclick="app.setEditorMode('text')" id="modeBtnText" class="flex items-center gap-1 px-3 py-1 rounded-lg text-xs font-semibold bg-white dark:bg-stone-800 text-amber-800 dark:text-amber-300 shadow-xs">
          <i data-lucide="type" class="w-3.5 h-3.5"></i>
          <span>הקלדה (PC)</span>
        </button>
        <button onclick="app.setEditorMode('canvas')" id="modeBtnCanvas" class="flex items-center gap-1 px-3 py-1 rounded-lg text-xs font-medium text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-white transition">
          <i data-lucide="pen-tool" class="w-3.5 h-3.5"></i>
          <span>עט (טאבלט)</span>
        </button>
        <button onclick="app.setEditorMode('dual')" id="modeBtnDual" class="flex items-center gap-1 px-3 py-1 rounded-lg text-xs font-medium text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-white transition">
          <i data-lucide="columns-2" class="w-3.5 h-3.5"></i>
          <span>מפוצל</span>
        </button>
      </div>

      <!-- Action Tools -->
      <div class="flex items-center gap-2">
        <button onclick="window.print()" title="הדפסה או ייצוא ל-PDF" class="p-1.5 text-stone-500 hover:text-stone-900 dark:text-stone-400 dark:hover:text-white hover:bg-stone-100 dark:hover:bg-stone-800 rounded-lg transition">
          <i data-lucide="printer" class="w-4 h-4"></i>
        </button>
        <button onclick="app.insertCanvasToNote()" title="הטמע את שרטוט העט לתוך גוף הסיכום" class="flex items-center gap-1.5 bg-amber-800 hover:bg-amber-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-xs transition active:scale-95">
          <i data-lucide="image-plus" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">הטמע שרטוט</span>
        </button>
      </div>

    </div>

    <!-- Workspace Surrounding Desk Frame with Generous Padding -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative rounded-2xl border border-stone-200/80 dark:border-stone-800 bg-stone-100/50 dark:bg-stone-900/40 p-2 sm:p-3 gap-3" id="workspaceContainer">
      
      <!-- ============================================== -->
      <!-- PANE A: RICH TEXT EDITOR (FLOATING SHEET)      -->
      <!-- ============================================== -->
      <div id="textPane" class="flex-1 flex flex-col bg-white dark:bg-stone-850 rounded-xl border border-stone-200/70 dark:border-stone-800 shadow-xs overflow-hidden">
        
        <!-- Formatting Toolbar -->
        <div class="no-print bg-stone-50 dark:bg-stone-800/60 border-b border-stone-200/70 dark:border-stone-800 px-3 py-1.5 flex flex-wrap items-center gap-1 text-stone-700 dark:text-stone-300 text-xs">
          
          <!-- Headings -->
          <div class="flex items-center bg-white dark:bg-stone-800 rounded-lg border border-stone-200 dark:border-stone-700 p-0.5">
            <button onclick="app.execCmd('formatBlock', '<h1>')" title="כותרת ראשית" class="px-2 py-1 hover:bg-stone-100 dark:hover:bg-stone-700 rounded font-bold font-serif text-xs">H1</button>
            <button onclick="app.execCmd('formatBlock', '<h2>')" title="כותרת משנית" class="px-2 py-1 hover:bg-stone-100 dark:hover:bg-stone-700 rounded font-bold font-serif text-xs">H2</button>
            <button onclick="app.execCmd('formatBlock', '<p>')" title="פסקה רגילה" class="px-2 py-1 hover:bg-stone-100 dark:hover:bg-stone-700 rounded text-xs">P</button>
          </div>

          <div class="w-px h-5 bg-stone-200 dark:bg-stone-700 mx-1"></div>

          <!-- Basic Styling -->
          <div class="flex items-center bg-white dark:bg-stone-800 rounded-lg border border-stone-200 dark:border-stone-700 p-0.5">
            <button onclick="app.execCmd('bold')" title="מודגש" class="p-1 hover:bg-stone-100 dark:hover:bg-stone-700 rounded font-bold">
              <i data-lucide="bold" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="app.execCmd('italic')" title="נטוי" class="p-1 hover:bg-stone-100 dark:hover:bg-stone-700 rounded italic">
              <i data-lucide="italic" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="app.execCmd('underline')" title="קו תחתון" class="p-1 hover:bg-stone-100 dark:hover:bg-stone-700 rounded">
              <i data-lucide="underline" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <div class="w-px h-5 bg-stone-200 dark:bg-stone-700 mx-1"></div>

          <!-- Lists & Alignment -->
          <div class="flex items-center bg-white dark:bg-stone-800 rounded-lg border border-stone-200 dark:border-stone-700 p-0.5">
            <button onclick="app.execCmd('insertUnorderedList')" title="תבליטים" class="p-1 hover:bg-stone-100 dark:hover:bg-stone-700 rounded">
              <i data-lucide="list" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="app.execCmd('insertOrderedList')" title="רשימה ממוספרת" class="p-1 hover:bg-stone-100 dark:hover:bg-stone-700 rounded">
              <i data-lucide="list-ordered" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="app.execCmd('justifyRight')" title="יישור לימין" class="p-1 hover:bg-stone-100 dark:hover:bg-stone-700 rounded">
              <i data-lucide="align-right" class="w-3.5 h-3.5"></i>
            </button>

  <!-- APPLICATION JAVASCRIPT LOGIC -->
  <script>
    const app = {
      notebooks: [],
      activeNotebookId: null,
      filters: { year: 'all', subject: 'all', search: '' },
      editorMode: 'dual',

      // Canvas state
      canvas: null,
      ctx: null,
      isDrawing: false,
      lastPoint: null,
      startPoint: null,
      canvasSnapshot: null,
      currentTool: 'pen',
      currentColor: '#1c1917',
      currentStrokeSize: 3,
      currentSheetTemplate: 'paper-grid',
      isDashed: false,
      isFilled: false,
      undoStack: [],
      redoStack: [],
      maxUndoSteps: 25,
      saveTimeout: null,

      coverStyles: {
        'color-sage': { colorClass: 'bg-emerald-800', borderClass: 'border-emerald-900', textAccent: 'text-emerald-700 dark:text-emerald-400' },
        'color-navy': { colorClass: 'bg-blue-900', borderClass: 'border-blue-950', textAccent: 'text-blue-700 dark:text-blue-400' },
        'color-terracotta': { colorClass: 'bg-red-900', borderClass: 'border-red-950', textAccent: 'text-rose-700 dark:text-rose-400' },
        'color-cognac': { colorClass: 'bg-amber-800', borderClass: 'border-amber-950', textAccent: 'text-amber-700 dark:text-amber-400' },
        'color-charcoal': { colorClass: 'bg-stone-700', borderClass: 'border-stone-800', textAccent: 'text-stone-700 dark:text-stone-400' }
      },

      STORAGE_KEY: 'smartnotes_academic_v3',
      THEME_KEY: 'smartnotes_theme_mode',

      init() {
        this.loadSettings();
        this.loadData();
        this.initCanvas();
        this.renderNotebooks();
        this.initInteractiveWidgetsObserver();
        lucide.createIcons();

        window.addEventListener('resize', () => {
          this.resizeCanvasKeepContent();
        });
      },

      loadSettings() {
        const savedTheme = localStorage.getItem(this.THEME_KEY);
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      },

      toggleDarkMode() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem(this.THEME_KEY, isDark ? 'dark' : 'light');
        lucide.createIcons();
      },

      loadData() {
        const saved = localStorage.getItem(this.STORAGE_KEY);
        if (saved) {
          try {
            this.notebooks = JSON.parse(saved);
            return;
          } catch (e) {
            console.error('Failed to parse saved data', e);
          }
        }

        this.notebooks = [
          {
            id: 'nb_1',
            title: 'אינפי 1 - נגזרות ואינטגרלים',
            year: 'שנה א\'',
            subject: 'מתמטיקה',
            coverStyle: 'color-sage',
            updatedAt: new Date().toISOString(),
            content: `
              <h1>הרצאה 4: משפטי גזירות וקירוב טיילור</h1>
              <p>סיכום מעמיק מתוך חומרי ההרצאה ותרגולי הבית.</p>
              <blockquote>
                <strong>משפט הערך הממוצע של לגראנז':</strong><br>
                f'(c) = [f(b) - f(a)] / (b - a)
              </blockquote>
              <p>ניתן לשרטט פונקציות וגרפים בטאבלט ולהטמיע ישירות בגוף הסיכום.</p>
            `,
            canvasData: null
          },
          {
            id: 'nb_2',
            title: 'מבני נתונים ואלגוריתמים 1',
            year: 'שנה ב\'',
            subject: 'מדעי המחשב',
            coverStyle: 'color-navy',
            updatedAt: new Date(Date.now() - 3600000 * 24).toISOString(),
            content: `
              <h1>עצי חיפוש בינאריים ו-AVL Trees</h1>
              <p>סקירת מבני נתונים מאוזנים וזמני ריצה של פעולות הכנסה, מחיקה וחיפוש.</p>
            `,
            canvasData: null
          },
          {
            id: 'nb_3',
            title: 'מכניקה קלאסית ותרמודינמיקה',
            year: 'שנה א\'',
            subject: 'פיזיקה',
            coverStyle: 'color-cognac',
            updatedAt: new Date(Date.now() - 3600000 * 48).toISOString(),
            content: `
              <h1>חוקי שימור ותנועה הרמונית פשוטה</h1>
              <p>סיכום תרגול: מתקף, תנע ומשפט עבודה-אנרגיה.</p>
            `,
            canvasData: null
          }
        ];
        this.saveData();
      },

      saveData() {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.notebooks));
      },

      showDashboard() {
        document.getElementById('editorView').classList.add('hidden');
        document.getElementById('dashboardView').classList.remove('hidden');
        this.activeNotebookId = null;
        this.renderNotebooks();
        lucide.createIcons();
      },

      openNotebook(id) {
        const nb = this.notebooks.find(n => n.id === id);
        if (!nb) return;

        this.activeNotebookId = id;
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('editorView').classList.remove('hidden');

        document.getElementById('activeNotebookTitle').textContent = nb.title;
        document.getElementById('activeNotebookYear').textContent = nb.year;
        document.getElementById('activeNotebookSubjectBadge').textContent = nb.subject;

        const contentDiv = document.getElementById('noteContent');
        contentDiv.innerHTML = nb.content || '<p>התחל לכתוב את הסיכום כאן...</p>';

        if (window.innerWidth < 768) {
          this.setEditorMode('text');
        } else {
          this.setEditorMode('dual');
        }

        setTimeout(() => {
          this.resizeCanvasKeepContent();
          if (nb.canvasData) {
            this.loadCanvasFromDataURL(nb.canvasData);
          } else {
            this.clearCanvasOnly();
          }
          this.attachWidgetListeners();
        }, 80);

        lucide.createIcons();
      },

      setEditorMode(mode) {
        this.editorMode = mode;
        const textPane = document.getElementById('textPane');
        const canvasPane = document.getElementById('canvasPane');
        const btnText = document.getElementById('modeBtnText');
        const btnCanvas = document.getElementById('modeBtnCanvas');
        const btnDual = document.getElementById('modeBtnDual');

        [btnText, btnCanvas, btnDual].forEach(btn => {
          btn.className = "flex items-center gap-1 px-3 py-1 rounded-lg text-xs font-medium text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-white transition";
        });

        const activeClass = "flex items-center gap-1 px-3 py-1 rounded-lg text-xs font-semibold bg-white dark:bg-stone-800 text-amber-800 dark:text-amber-300 shadow-xs";

        if (mode === 'text') {
          textPane.classList.remove('hidden');
          canvasPane.classList.add('hidden');
          btnText.className = activeClass;
        } else if (mode === 'canvas') {
          textPane.classList.add('hidden');
          canvasPane.classList.remove('hidden');
          btnCanvas.className = activeClass;
          setTimeout(() => this.resizeCanvasKeepContent(), 60);
        } else {
          textPane.classList.remove('hidden');
          canvasPane.classList.remove('hidden');
          btnDual.className = activeClass;
          setTimeout(() => this.resizeCanvasKeepContent(), 60);
        }
      },

      setYearFilter(year) {
        this.filters.year = year;
        document.querySelectorAll('.year-tab').forEach(btn => {
          if (btn.dataset.year === year) {
            btn.className = 'year-tab px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-amber-800 text-white';
          } else {
            btn.className = 'year-tab px-3 py-1.5 rounded-lg text-xs font-medium text-stone-600 dark:text-stone-300 hover:bg-stone-200/60 dark:hover:bg-stone-800';
          }
        });
        this.renderNotebooks();
      },

      setSubjectFilter(subject) {
        this.filters.subject = subject;
        this.renderNotebooks();
      },

      setSearchFilter(query) {
        this.filters.search = query.trim().toLowerCase();
        this.renderNotebooks();
      },

      resetFilters() {
        this.filters = { year: 'all', subject: 'all', search: '' };
        document.getElementById('searchInput').value = '';
        document.getElementById('subjectFilterSelect').value = 'all';
        this.setYearFilter('all');
      },

      // Render Compact Notebook Icons / Cards
      renderNotebooks() {
        const grid = document.getElementById('notebooksGrid');
        const emptyState = document.getElementById('emptyState');
        grid.innerHTML = '';

        let filtered = this.notebooks.filter(nb => {
          const matchYear = (this.filters.year === 'all') || (nb.year === this.filters.year);
          const matchSubject = (this.filters.subject === 'all') || (nb.subject === this.filters.subject);
          const matchSearch = (!this.filters.search) || 
            (nb.title.toLowerCase().includes(this.filters.search)) || 
            (nb.content && nb.content.toLowerCase().includes(this.filters.search));
          return matchYear && matchSubject && matchSearch;
        });

        if (filtered.length === 0) {
          emptyState.classList.remove('hidden');
          return;
        } else {
          emptyState.classList.add('hidden');
        }

        filtered.forEach(nb => {
          const style = this.coverStyles[nb.coverStyle] || this.coverStyles['color-sage'];
          const formattedDate = new Date(nb.updatedAt).toLocaleDateString('he-IL', {
            month: 'numeric',
            day: 'numeric'
          });

          // Compact notebook tile with small book icon
          const card = document.createElement('div');
          card.className = "compact-nb-card bg-white dark:bg-stone-850 border border-stone-200/80 dark:border-stone-750 rounded-xl p-3.5 shadow-xs cursor-pointer flex flex-col justify-between hover:shadow-md hover:border-amber-700/40 relative overflow-hidden group";
          
          card.onclick = () => app.openNotebook(nb.id);

          card.innerHTML = `
            <!-- Top spine accent line -->
            <div class="absolute top-0 right-0 left-0 h-1.5 ${style.colorClass}"></div>

            <!-- Header of card with small icon -->
            <div class="flex items-start justify-between gap-2 pt-1 mb-2">
              <div class="flex items-center gap-2">
                <!-- Small Notebook Icon -->
                <div class="w-7 h-7 rounded-lg ${style.colorClass} text-white flex items-center justify-center shrink-0 shadow-xs">
                  <i data-lucide="book" class="w-3.5 h-3.5"></i>
                </div>
                <span class="text-[11px] font-semibold text-stone-500 dark:text-stone-400 bg-stone-100 dark:bg-stone-800 px-2 py-0.5 rounded-md">
                  ${nb.year}
                </span>
              </div>

              <!-- Delete button -->
              <button onclick="event.stopPropagation(); app.confirmDeleteNotebook('${nb.id}')" title="מחק מחברת" class="p-1 rounded-md text-stone-400 hover:text-red-600 hover:bg-stone-100 dark:hover:bg-stone-800 opacity-60 group-hover:opacity-100 transition">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>

            <!-- Title -->
            <div class="my-1.5">
              <h3 class="font-bold text-sm font-serif text-stone-900 dark:text-stone-100 line-clamp-2 leading-snug">
                ${nb.title}
              </h3>
            </div>

            <!-- Bottom meta -->
            <div class="flex items-center justify-between text-[11px] text-stone-400 pt-2 border-t border-stone-100 dark:border-stone-800">
              <span class="font-medium ${style.textAccent}">${nb.subject}</span>
              <span class="text-[10px]">${formattedDate}</span>
            </div>
          `;

          grid.appendChild(card);
        });

        lucide.createIcons();
      },

      openNewNotebookModal() {
        const modal = document.getElementById('newNotebookModal');
        const card = document.getElementById('newNotebookCard');
        modal.classList.remove('opacity-0', 'pointer-events-none');
        card.classList.remove('scale-95');
        document.getElementById('nbTitleInput').focus();
        lucide.createIcons();
      },

      closeNewNotebookModal() {
        const modal = document.getElementById('newNotebookModal');
        const card = document.getElementById('newNotebookCard');
        modal.classList.add('opacity-0', 'pointer-events-none');
        card.classList.add('scale-95');
        document.getElementById('nbTitleInput').value = '';
      },

      handleCreateNotebook(e) {
        e.preventDefault();
        const title = document.getElementById('nbTitleInput').value.trim();
        const year = document.getElementById('nbYearSelect').value;
        const subject = document.getElementById('nbSubjectSelect').value;
        const selectedColorRadio = document.querySelector('input[name="nbColor"]:checked');
        const coverStyle = selectedColorRadio ? selectedColorRadio.value : 'color-sage';

        if (!title) return;

        const newNb = {
          id: 'nb_' + Date.now(),
          title: title,
          year: year,
          subject: subject,
          coverStyle: coverStyle,
          updatedAt: new Date().toISOString(),
          content: `<h1>${title}</h1><p>התחל לכתוב את סיכום ההרצאה כאן...</p>`,
          canvasData: null
        };

        this.notebooks.unshift(newNb);
        this.saveData();
        this.closeNewNotebookModal();
        this.openNotebook(newNb.id);
      },

      notebookToDeleteId: null,
      confirmDeleteNotebook(id) {
        this.notebookToDeleteId = id;
        const modal = document.getElementById('confirmModal');
        modal.classList.remove('opacity-0', 'pointer-events-none');
        
        document.getElementById('confirmBtnAction').onclick = () => {
          this.notebooks = this.notebooks.filter(n => n.id !== this.notebookToDeleteId);
          this.saveData();
          this.closeConfirmModal();
          this.renderNotebooks();
        };
        lucide.createIcons();
      },

      closeConfirmModal() {
        const modal = document.getElementById('confirmModal');
        modal.classList.add('opacity-0', 'pointer-events-none');
        this.notebookToDeleteId = null;
      },

      // Rich Text Editor Commands
      execCmd(command, value = null) {
        document.getElementById('noteContent').focus();
        document.execCommand(command, false, value);
        this.onTextChange();
      },

      insertCodeBlock() {
        const codeHTML = `<pre class="bg-stone-100 dark:bg-stone-800 p-2.5 rounded-lg font-mono text-xs my-2 text-amber-900 dark:text-amber-300"><code>// כתוב קוד או נוסחה כאן\n</code></pre><p><br></p>`;
        document.execCommand('insertHTML', false, codeHTML);
        this.onTextChange();
      },

      insertMathSnippet() {
        const formulaHTML = `
          <div style="background: rgba(190, 140, 84, 0.08); border: 1px solid rgba(190, 140, 84, 0.3); border-radius: 8px; padding: 8px 12px; margin: 8px 0; display: inline-block; direction: ltr;">
            <span style="font-family: serif; font-size: 1.15em; font-style: italic; color: #78350f;">lim (x→0) [sin(x) / x] = 1</span>
          </div>
          <p><br></p>
        `;
        document.execCommand('insertHTML', false, formulaHTML);
        this.onTextChange();
      },

      onTextChange() {
        if (!this.activeNotebookId) return;
        const nb = this.notebooks.find(n => n.id === this.activeNotebookId);
        if (!nb) return;

        nb.content = document.getElementById('noteContent').innerHTML;
        nb.updatedAt = new Date().toISOString();
        this.triggerAutoSave();
      },

      triggerAutoSave() {
        const indicator = document.getElementById('saveStatusIndicator');
        indicator.innerHTML = `שומר...`;
        indicator.className = "text-[11px] text-amber-600 font-medium";

        clearTimeout(this.saveTimeout);
        this.saveTimeout = setTimeout(() => {
          this.saveData();
          indicator.innerHTML = `נשמר`;
          indicator.className = "text-[11px] text-emerald-600 dark:text-emerald-400 font-medium";
        }, 500);
      },

      // Embed Sketch Widget
      insertCanvasToNote() {
        if (!this.canvas) return;
        const dataUrl = this.canvas.toDataURL('image/png');
        const widgetId = 'sketch_' + Date.now();

        const widgetHTML = `
          <div class="sketch-widget active-widget" id="${widgetId}" contenteditable="false" style="width: 320px; text-align: center; float: none; display: block; margin: 1.25rem auto;">
            <div class="sketch-widget-toolbar absolute -top-8 left-1/2 -translate-x-1/2 flex items-center gap-1 bg-stone-900/90 text-white p-1 rounded-lg shadow border border-stone-700/60 z-30">
              <span class="sketch-drag-handle p-0.5 hover:bg-stone-700 rounded text-stone-300" title="גרור להזזה">
                <i data-lucide="move" class="w-3.5 h-3.5"></i>
              </span>
              <button onclick="app.setWidgetAlign('${widgetId}', 'right')" class="p-0.5 hover:bg-stone-700 rounded" title="יישור לימין">
                <i data-lucide="align-right" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="app.setWidgetAlign('${widgetId}', 'center')" class="p-0.5 hover:bg-stone-700 rounded" title="יישור למרכז">
                <i data-lucide="align-center" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="app.setWidgetAlign('${widgetId}', 'left')" class="p-0.5 hover:bg-stone-700 rounded" title="יישור לשמאל">
                <i data-lucide="align-left" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="app.deleteWidget('${widgetId}')" class="p-0.5 hover:bg-red-700 text-red-300 rounded" title="מחק">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
            <img src="${dataUrl}" alt="שרטוט מטאבלט" class="w-full h-auto rounded-lg block pointer-events-none">
            <div class="sketch-resize-handle" onmousedown="app.startWidgetResize(event, '${widgetId}')" ontouchstart="app.startWidgetResize(event, '${widgetId}')"></div>
          </div>

        document.getElementById('noteContent').focus();

      setWidgetAlign(widgetId, alignment) {
        const el = document.getElementById(widgetId);
        if (!el) return;
        if (alignment === 'right') {
          el.style.float = 'none';
          el.style.display = 'block';
          el.style.margin = '1rem 0 1rem auto';
        } else if (alignment === 'center') {
          el.style.float = 'none';
          el.style.display = 'block';
          el.style.margin = '1rem auto';
        } else if (alignment === 'left') {
          el.style.float = 'none';
          el.style.display = 'block';
          el.style.margin = '1rem auto 1rem 0';
        }
        this.onTextChange();
      },

      deleteWidget(widgetId) {
        const el = document.getElementById(widgetId);
        if (el) {
          el.remove();
          this.onTextChange();
        }
      },

      startWidgetResize(e, widgetId) {
        e.preventDefault();
        e.stopPropagation();

        const el = document.getElementById(widgetId);
        if (!el) return;

        const startX = e.touches ? e.touches[0].clientX : e.clientX;
        const startWidth = el.offsetWidth;

        const onMove = (moveEvent) => {
          const currentX = moveEvent.touches ? moveEvent.touches[0].clientX : moveEvent.clientX;
          const diff = startX - currentX;
          const newWidth = Math.max(140, Math.min(760, startWidth + diff));
          el.style.width = `${newWidth}px`;
        };

        const onStop = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onStop);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onStop);
          this.onTextChange();
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onStop);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onStop);
      },

      attachWidgetListeners() {
        const editor = document.getElementById('noteContent');
        const widgets = editor.querySelectorAll('.sketch-widget');
        
        widgets.forEach(w => {
          const dragHandle = w.querySelector('.sketch-drag-handle');
          if (dragHandle) {
            dragHandle.onmousedown = () => w.setAttribute('draggable', 'true');
            w.ondragstart = (e) => e.dataTransfer.setData('text/plain', w.id);
            w.ondragend = () => {
              w.removeAttribute('draggable');
              this.onTextChange();
            };
          }
        });

        editor.ondragover = (e) => e.preventDefault();
        editor.ondrop = (e) => {
          e.preventDefault();
          const widgetId = e.dataTransfer.getData('text/plain');
          const widget = document.getElementById(widgetId);
          if (widget) {
            let dropTarget = document.elementFromPoint(e.clientX, e.clientY);
            if (dropTarget && dropTarget !== widget && editor.contains(dropTarget)) {
              while (dropTarget.parentElement && dropTarget.parentElement !== editor) {
                dropTarget = dropTarget.parentElement;
              }
              editor.insertBefore(widget, dropTarget);
              this.onTextChange();
            }
          }
        };
      },

      initInteractiveWidgetsObserver() {
        const observer = new MutationObserver(() => lucide.createIcons());
        const editor = document.getElementById('noteContent');
        if (editor) observer.observe(editor, { childList: true });
      },

      // Stylus Canvas Engine
      initCanvas() {
        this.canvas = document.getElementById('drawingCanvas');
        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });

        this.canvas.addEventListener('pointerdown', (e) => this.onPointerDown(e));
        this.canvas.addEventListener('pointermove', (e) => this.onPointerMove(e));
        this.canvas.addEventListener('pointerup', (e) => this.onPointerUp(e));
        this.canvas.addEventListener('pointercancel', (e) => this.onPointerUp(e));
        this.canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
      },

      resizeCanvasKeepContent() {
        if (!this.canvas) return;
        const wrapper = document.getElementById('canvasWrapper');
        if (!wrapper || wrapper.clientWidth === 0 || wrapper.clientHeight === 0) return;

        const newWidth = wrapper.clientWidth;
        const newHeight = wrapper.clientHeight;

        if (this.canvas.width === newWidth && this.canvas.height === newHeight) return;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = this.canvas.width;
        tempCanvas.height = this.canvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        if (this.canvas.width > 0 && this.canvas.height > 0) {
          tempCtx.drawImage(this.canvas, 0, 0);
        }

        this.canvas.width = newWidth;
        this.canvas.height = newHeight;
        this.ctx.drawImage(tempCanvas, 0, 0);
      },

      getCanvasPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
          pressure: (e.pressure !== undefined && e.pressure > 0) ? e.pressure : 0.5
        };
      },

      isShapeTool(tool) {
        return ['line', 'arrow', 'axes', 'rect', 'circle', 'triangle'].includes(tool);
      },

      onPointerDown(e) {
        if (!e.isPrimary) return;
        this.isDrawing = true;
        this.pushUndoState();
        const pos = this.getCanvasPos(e);
        this.startPoint = pos;
        this.lastPoint = pos;

        if (this.isShapeTool(this.currentTool)) {
          this.canvasSnapshot = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
        } else {
          this.ctx.beginPath();
          this.ctx.moveTo(pos.x, pos.y);
        }
      },

      onPointerMove(e) {
        if (!this.isDrawing) return;
        const currentPoint = this.getCanvasPos(e);

        if (this.isShapeTool(this.currentTool)) {
          if (this.canvasSnapshot) {
            this.ctx.putImageData(this.canvasSnapshot, 0, 0);
          }
          this.renderShape(this.ctx, this.currentTool, this.startPoint, currentPoint);
          return;
        }

        this.ctx.save();
        this.ctx.lineCap = 'round';
        this.ctx.lineJoin = 'round';

        if (this.isDashed) {
          this.ctx.setLineDash([this.currentStrokeSize * 2, this.currentStrokeSize * 2]);
        } else {
          this.ctx.setLineDash([]);
        }

        if (this.currentTool === 'eraser') {
          this.ctx.globalCompositeOperation = 'destination-out';
          this.ctx.lineWidth = this.currentStrokeSize * 4;
        } else if (this.currentTool === 'highlighter') {
          this.ctx.globalCompositeOperation = 'source-over';
          this.ctx.strokeStyle = this.hexToRGBA(this.currentColor, 0.35);
          this.ctx.lineWidth = this.currentStrokeSize * 3.5;
        } else if (this.currentTool === 'brush') {
          this.ctx.globalCompositeOperation = 'source-over';
          this.ctx.strokeStyle = this.currentColor;
          const dynamicSize = this.currentStrokeSize * (0.35 + currentPoint.pressure * 1.6);
          this.ctx.lineWidth = Math.max(1, dynamicSize);
        } else {
          this.ctx.globalCompositeOperation = 'source-over';
          this.ctx.strokeStyle = this.currentColor;
          this.ctx.lineWidth = this.currentStrokeSize;
        }

        const midPoint = {
          x: (this.lastPoint.x + currentPoint.x) / 2,
          y: (this.lastPoint.y + currentPoint.y) / 2
        };

        this.ctx.quadraticCurveTo(this.lastPoint.x, this.lastPoint.y, midPoint.x, midPoint.y);
        this.ctx.stroke();
        this.ctx.beginPath();
        this.ctx.moveTo(midPoint.x, midPoint.y);

        this.ctx.restore();
        this.lastPoint = currentPoint;
      },

      onPointerUp(e) {
        if (!this.isDrawing) return;
        this.isDrawing = false;

        if (this.isShapeTool(this.currentTool)) {
          const currentPoint = this.getCanvasPos(e);
          if (this.canvasSnapshot) {
            this.ctx.putImageData(this.canvasSnapshot, 0, 0);
          }
          this.renderShape(this.ctx, this.currentTool, this.startPoint, currentPoint);
          this.canvasSnapshot = null;
        } else {
          this.ctx.closePath();
        }

        this.redoStack = [];
        this.saveCanvasToCurrentNotebook();
      },

      renderShape(ctx, tool, start, end) {
        if (!start || !end) return;
        ctx.save();
        ctx.strokeStyle = this.currentColor;
        ctx.fillStyle = this.hexToRGBA(this.currentColor, 0.15);
        ctx.lineWidth = this.currentStrokeSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (this.isDashed) {
          ctx.setLineDash([this.currentStrokeSize * 2.5, this.currentStrokeSize * 1.8]);
        } else {
          ctx.setLineDash([]);
        }

        const x1 = start.x, y1 = start.y;
        const x2 = end.x, y2 = end.y;

        switch (tool) {
          case 'line':
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            break;
          case 'arrow':
            this.drawArrow(ctx, x1, y1, x2, y2);
            break;
          case 'axes':
            this.drawGraphAxes(ctx, x1, y1, x2, y2);
            break;
          case 'rect':
            const rx = Math.min(x1, x2), ry = Math.min(y1, y2);
            const rw = Math.abs(x2 - x1), rh = Math.abs(y2 - y1);
            if (this.isFilled) ctx.fillRect(rx, ry, rw, rh);
            ctx.strokeRect(rx, ry, rw, rh);
            break;
          case 'circle':
            const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
            const rxRad = Math.abs(x2 - x1) / 2, ryRad = Math.abs(y2 - y1) / 2;
            ctx.beginPath();
            ctx.ellipse(cx, cy, Math.max(1, rxRad), Math.max(1, ryRad), 0, 0, Math.PI * 2);
            if (this.isFilled) ctx.fill();
            ctx.stroke();
            break;
          case 'triangle':
            ctx.beginPath();
            ctx.moveTo((x1 + x2) / 2, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x1, y2);
            ctx.closePath();
            if (this.isFilled) ctx.fill();
            ctx.stroke();
            break;
        }
        ctx.restore();
      },

      drawArrow(ctx, fromX, fromY, toX, toY) {
        const headLength = Math.max(10, this.currentStrokeSize * 3);
        const angle = Math.atan2(toY - fromY, toX - fromX);

        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.stroke();

        ctx.save();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headLength * Math.cos(angle - Math.PI / 6), toY - headLength * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headLength * Math.cos(angle + Math.PI / 6), toY - headLength * Math.sin(angle + Math.PI / 6));
        ctx.stroke();
        ctx.restore();
      },

      drawGraphAxes(ctx, x1, y1, x2, y2) {
        const ox = x1, oy = y2;
        const headLen = Math.max(9, this.currentStrokeSize * 2.5);

        ctx.save();
        ctx.setLineDash([]);
        ctx.lineWidth = Math.max(1.8, this.currentStrokeSize);

        // X-Axis
        ctx.beginPath();
        ctx.moveTo(ox, oy);
        ctx.lineTo(x2, oy);
        const dirX = x2 >= ox ? 1 : -1;
        ctx.lineTo(x2 - dirX * headLen, oy - 4);
        ctx.moveTo(x2, oy);
        ctx.lineTo(x2 - dirX * headLen, oy + 4);
        ctx.stroke();

        // Y-Axis
        ctx.beginPath();
        ctx.moveTo(ox, oy);
        ctx.lineTo(ox, y1);
        const dirY = y1 <= oy ? 1 : -1;
        ctx.lineTo(ox - 4, y1 + dirY * headLen);
        ctx.moveTo(ox, y1);
        ctx.lineTo(ox + 4, y1 + dirY * headLen);
        ctx.stroke();

        // Interval Ticks
        const tickSpacing = 26;
        const tickSize = 3;
        ctx.lineWidth = 1.2;

        const stepX = (x2 >= ox) ? tickSpacing : -tickSpacing;
        for (let tx = ox + stepX; Math.abs(tx - ox) < Math.abs(x2 - ox) - 12; tx += stepX) {
          ctx.beginPath();
          ctx.moveTo(tx, oy - tickSize);
          ctx.lineTo(tx, oy + tickSize);
          ctx.stroke();
        }

        const stepY = (y1 <= oy) ? -tickSpacing : tickSpacing;
        for (let ty = oy + stepY; Math.abs(ty - oy) < Math.abs(y1 - oy) - 12; ty += stepY) {
          ctx.beginPath();
          ctx.moveTo(ox - tickSize, ty);
          ctx.lineTo(ox + tickSize, ty);
          ctx.stroke();
        }

        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = this.currentColor;
        ctx.fillText('x', x2 + (dirX * 5), oy + 3);
        ctx.fillText('y', ox - 3, y1 - (dirY * 5));
        ctx.fillText('0', ox - 10, oy + 10);

        ctx.restore();
      },

      toggleDashed() {
        this.isDashed = !this.isDashed;
        document.getElementById('btnDashed').className = this.isDashed
          ? "p-1.5 rounded-lg border border-amber-400 bg-amber-100 text-amber-900"
          : "p-1.5 rounded-lg border border-stone-200 dark:border-stone-700 bg-white dark:bg-stone-800 text-stone-600 dark:text-stone-300 hover:bg-stone-100";
      },

      toggleFill() {
        this.isFilled = !this.isFilled;
        document.getElementById('btnFill').className = this.isFilled
          ? "p-1.5 rounded-lg border border-amber-400 bg-amber-100 text-amber-900"
          : "p-1.5 rounded-lg border border-stone-200 dark:border-stone-700 bg-white dark:bg-stone-800 text-stone-600 dark:text-stone-300 hover:bg-stone-100";
      },

      saveCanvasToCurrentNotebook() {
        if (!this.activeNotebookId) return;
        const nb = this.notebooks.find(n => n.id === this.activeNotebookId);
        if (!nb) return;

        nb.canvasData = this.canvas.toDataURL('image/png');
        nb.updatedAt = new Date().toISOString();
        this.triggerAutoSave();
      },

      loadCanvasFromDataURL(dataUrl) {
        const img = new Image();
        img.onload = () => {
          this.clearCanvasOnly();
          this.ctx.drawImage(img, 0, 0);
        };
        img.src = dataUrl;
      },

      clearCanvasOnly() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      },

      clearCanvasPrompt() {
        this.pushUndoState();
        this.clearCanvasOnly();
        this.saveCanvasToCurrentNotebook();
      },

      pushUndoState() {
        if (this.undoStack.length >= this.maxUndoSteps) this.undoStack.shift();
        this.undoStack.push(this.canvas.toDataURL('image/png'));
      },

      undoCanvas() {
        if (this.undoStack.length === 0) return;
        this.redoStack.push(this.canvas.toDataURL('image/png'));
        this.loadCanvasFromDataURL(this.undoStack.pop());
      },

      redoCanvas() {
        if (this.redoStack.length === 0) return;
        this.undoStack.push(this.canvas.toDataURL('image/png'));
        this.loadCanvasFromDataURL(this.redoStack.pop());
      },

      setTool(tool) {
        this.currentTool = tool;
        const toolButtons = {
          pen: document.getElementById('toolPen'),
          brush: document.getElementById('toolBrush'),
          highlighter: document.getElementById('toolHighlighter'),
          eraser: document.getElementById('toolEraser'),
          line: document.getElementById('toolLine'),
          arrow: document.getElementById('toolArrow'),
          axes: document.getElementById('toolAxes'),
          rect: document.getElementById('toolRect'),
          circle: document.getElementById('toolCircle'),
          triangle: document.getElementById('toolTriangle')
        };

        const activeClass = "p-1.5 rounded bg-amber-800 text-white font-medium shadow-xs";
        const inactiveClass = "p-1.5 rounded text-stone-600 dark:text-stone-300 hover:bg-stone-100";

        for (let t in toolButtons) {
          if (toolButtons[t]) {
            toolButtons[t].className = (t === tool) ? activeClass : inactiveClass;
          }
        }
      },

      setColor(hex) {
        this.currentColor = hex;
        document.getElementById('brushPreviewCircle').style.backgroundColor = hex;
        if (this.currentTool === 'eraser') this.setTool('pen');
      },

      setStrokeSize(size) {
        this.currentStrokeSize = parseInt(size, 10);
        document.getElementById('sizeDisplay').textContent = `${size}px`;
        const preview = document.getElementById('brushPreviewCircle');
        preview.style.width = `${Math.min(18, Math.max(3, size))}px`;
        preview.style.height = `${Math.min(18, Math.max(3, size))}px`;
      },

      setSheetTemplate(templateClass) {
        this.currentSheetTemplate = templateClass;
        document.getElementById('canvasWrapper').className = `flex-1 w-full h-full relative ${templateClass} overflow-hidden`;
      },

      exportAllData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.notebooks, null, 2));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = `smartnotes_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      },

      importAllData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (Array.isArray(imported)) {
              this.notebooks = imported;
              this.saveData();
              this.renderNotebooks();
            }
          } catch (err) {
            console.error('Import failed', err);
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      },

      hexToRGBA(hex, alpha) {
        let c;
        if (/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)) {
          c = hex.substring(1).split('');
          if (c.length === 3) c = [c[0], c[0], c[1], c[1], c[2], c[2]];
          c = '0x' + c.join('');
          return `rgba(${[(c>>16)&255, (c>>8)&255, c&255].join(',')},${alpha})`;
        }
        return hex;
      }
    };

    window.onload = () => app.init();
  </script>
</body>
